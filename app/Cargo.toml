[package]
name = "video-enhancer"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ffmpeg-next = { version = "=9.0.0", default-features = false, features = ["format"] }
wry = { version = "0.57", default-features = false, features = ["os-webview"] }
tao = "0.35"
rfd = "0.17"
tempfile = "3"
webview2-com = "0.39"
windows-core = "0.62"
